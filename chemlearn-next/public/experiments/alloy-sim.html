<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alloy vs Pure Metal Lattice Physics Simulator | ChemLearn AI</title>
    <meta name="description" content="Interactive 2D physics simulation demonstrating atomic layer slippage in pure metals versus foreign atom dislocation pinning in alloys.">
    <link rel="canonical" href="https://chemlearn-67.web.app/experiments/alloy-sim.html">
    <style>
        :root {
            --primary: #6d28d9;
            --primary-hover: #5b21b6;
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #a78bfa;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .controls-top {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background-color: var(--bg-panel);
            color: var(--text-light);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn.active {
            background-color: var(--primary);
            box-shadow: 0 0 15px rgba(109, 40, 217, 0.5);
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
        }

        .left-panel {
            background-color: var(--bg-panel);
            padding: 20px;
            border-radius: var(--border-radius);
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .gauge-container {
            position: relative;
            width: 100%;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .gauge-bg {
            fill: none;
            stroke: #334155;
            stroke-width: 12;
            stroke-linecap: round;
        }

        .gauge-val {
            fill: none;
            stroke: var(--primary);
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dasharray 0.1s ease;
        }

        .gauge-yield-pure, .gauge-yield-alloy {
            fill: var(--accent-orange);
        }

        .gauge-text {
            fill: var(--text-light);
            font-size: 24px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: mathematical;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--text-muted);
        }

        .btn-outline:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .canvas-container {
            flex: 1;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .banner {
            max-width: 1000px;
            margin: 20px auto 0;
            background-color: var(--bg-panel);
            padding: 20px;
            border-radius: var(--border-radius);
            border-left: 5px solid var(--primary);
            font-size: 1.1rem;
            line-height: 1.5;
            min-height: 80px;
            display: flex;
            align-items: center;
        }

        .stats-labels {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .yield-marker {
            position: absolute;
            font-size: 0.75rem;
            color: var(--text-muted);
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <header>
        <h1>Chapter 8.1: Alloy vs Pure Metal Shear Stress Modeler</h1>
        <div class="controls-top">
            <button class="toggle-btn active" id="btnPure" aria-label="Select Pure Metal Mode">
                <span>🔩</span> Pure Metal
            </button>
            <button class="toggle-btn" id="btnAlloy" aria-label="Select Alloy Mode">
                <span>⚙️</span> Alloy (e.g. Duralumin/Steel)
            </button>
        </div>
    </header>

    <div class="main-container">
        <aside class="left-panel">
            <div class="slider-container">
                <label for="forceSlider" id="forceLabel">Applied Force: 0 N</label>
                <input type="range" id="forceSlider" min="0" max="100" value="0" aria-labelledby="forceLabel">
            </div>

            <div class="gauge-container">
                <svg class="gauge-svg" viewBox="0 0 100 50">
                    <path class="gauge-bg" d="M 10,50 A 40,40 0 0,1 90,50" />
                    <!-- Length of arc is ~125.6 -->
                    <path class="gauge-val" id="gaugeVal" d="M 10,50 A 40,40 0 0,1 90,50" stroke-dasharray="0, 125.6" />
                    
                    <!-- Yield Markers -->
                    <circle cx="22.36" cy="11.96" r="3" class="gauge-yield-pure" id="markerPure" aria-label="Yield Strength Pure" title="Yield Strength (Pure)"/>
                    <text x="18" y="10" font-size="6" fill="#94a3b8">40</text>
                    
                    <circle cx="77.64" cy="11.96" r="3" class="gauge-yield-alloy" id="markerAlloy" style="display:none;" aria-label="Yield Strength Alloy" title="Yield Strength (Alloy)"/>
                    <text x="82" y="10" font-size="6" fill="#94a3b8" id="textAlloy" style="display:none;">80</text>
                    
                    <text x="50" y="45" class="gauge-text" id="gaugeText">0</text>
                </svg>
            </div>
            
            <div class="stats-labels">
                <div>Yield Strength (Pure): <strong style="color:var(--accent-orange)">40 units</strong></div>
                <div>Yield Strength (Alloy): <strong style="color:var(--accent-orange)">80 units</strong></div>
            </div>

            <button class="btn" id="btnMaxForce">Apply Max Force</button>
            <button class="btn btn-outline" id="btnReset">Reset Lattice</button>
        </aside>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="simCanvas"></canvas>
        </div>
    </div>

    <div class="banner" id="explanationBanner" role="status" aria-live="polite">
        ✅ Regular arrangement of same-size metallic atoms. Layers can slide past each other easily under stress — this is why pure metals are malleable and ductile.
    </div>

    <script>
        /** Utilities */
        const escapeHtml = (unsafe) => {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        };

        /** Simulation State */
        const state = {
            mode: 'pure', // 'pure' or 'alloy'
            force: 0,
            status: 'idle', // idle, applying_force, sliding, resisting, fracture
            atoms: [],
            electrons: [],
            fractured: false,
            animatingForce: false,
            slipOffset: 0,
            cols: 10,
            rows: 8,
            baseRadius: 20,
            canvasW: 600,
            canvasH: 500,
            isDragging: false,
            lastMouseX: 0
        };

        const config = {
            pureYield: 40,
            alloyYield: 80,
            slipLayers: 4 // Top 4 layers slide (indices 0, 1, 2, 3)
        };

        const DOM = {
            canvas: document.getElementById('simCanvas'),
            ctx: document.getElementById('simCanvas').getContext('2d'),
            slider: document.getElementById('forceSlider'),
            forceLabel: document.getElementById('forceLabel'),
            gaugeVal: document.getElementById('gaugeVal'),
            gaugeText: document.getElementById('gaugeText'),
            btnPure: document.getElementById('btnPure'),
            btnAlloy: document.getElementById('btnAlloy'),
            btnMaxForce: document.getElementById('btnMaxForce'),
            btnReset: document.getElementById('btnReset'),
            banner: document.getElementById('explanationBanner'),
            markerPure: document.getElementById('markerPure'),
            markerAlloy: document.getElementById('markerAlloy'),
            textAlloy: document.getElementById('textAlloy'),
            canvasContainer: document.getElementById('canvasContainer')
        };

        // Resize Canvas and handle device DPI
        function resizeCanvas() {
            const rect = DOM.canvasContainer.getBoundingClientRect();
            state.canvasW = rect.width;
            state.canvasH = 500;
            
            const dpr = window.devicePixelRatio || 1;
            DOM.canvas.width = state.canvasW * dpr;
            DOM.canvas.height = state.canvasH * dpr;
            DOM.ctx.scale(dpr, dpr);
            
            initLattice();
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        function getIdealX(col, row) {
            const spacing = state.baseRadius * 2.2;
            let x = 60 + col * spacing;
            if (row % 2 !== 0) {
                x += spacing / 2;
            }
            return x;
        }

        function getIdealY(row) {
            const vSpacing = state.baseRadius * Math.sqrt(3);
            return 80 + row * vSpacing;
        }

        function initLattice() {
            state.atoms = [];
            state.electrons = [];
            state.fractured = false;
            state.slipOffset = 0;
            state.status = 'idle';
            DOM.slider.value = state.force;
            updateUIForce();

            // Create Atoms
            for (let row = 0; row < state.rows; row++) {
                for (let col = 0; col < state.cols; col++) {
                    let r = state.baseRadius;
                    let color = '#94a3b8'; // metallic silver-blue
                    let isForeign = false;
                    let foreignType = 'none';

                    if (state.mode === 'alloy') {
                        // Substitutional (Large)
                        if ((col === 2 && row === 3) || (col === 5 && row === 6)) {
                            r = 28;
                            color = '#f97316'; // orange
                            isForeign = true;
                            foreignType = 'substitutional';
                        }
                    }

                    const x = getIdealX(col, row);
                    const y = getIdealY(row);

                    state.atoms.push({
                        id: `atom_${row}_${col}`,
                        col, row,
                        x, y,
                        idealX: x, idealY: y,
                        vx: 0, vy: 0,
                        radius: r,
                        color,
                        isForeign,
                        foreignType,
                        layer: row
                    });
                }
            }

            // Interstitial (Small) for alloy
            if (state.mode === 'alloy') {
                const interstitials = [
                    { col: 3, row: 4.5 },
                    { col: 6, row: 4.5 }
                ];

                interstitials.forEach((pos, i) => {
                    const x = getIdealX(pos.col, Math.floor(pos.row)) + state.baseRadius;
                    const y = getIdealY(Math.floor(pos.row)) + state.baseRadius * 0.8;
                    state.atoms.push({
                        id: `inter_${i}`,
                        col: pos.col, row: pos.row,
                        x, y, idealX: x, idealY: y,
                        vx: 0, vy: 0,
                        radius: 10,
                        color: '#22c55e', // green
                        isForeign: true,
                        foreignType: 'interstitial',
                        layer: Math.floor(pos.row)
                    });
                });
                
                // Distort lattice around foreign atoms
                distortLattice();
            }

            // Generate Electron Cloud (Random dots)
            for(let i=0; i<150; i++) {
                state.electrons.push({
                    x: Math.random() * state.canvasW,
                    y: Math.random() * state.canvasH,
                    r: Math.random() * 2 + 1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5
                });
            }

            updateBanner();
        }

        function distortLattice() {
            const foreignAtoms = state.atoms.filter(a => a.isForeign);
            
            // multiple iterations for relaxation
            for (let iter = 0; iter < 10; iter++) {
                state.atoms.forEach(atom => {
                    if (atom.isForeign) return;
                    
                    let dxSum = 0;
                    let dySum = 0;
                    
                    foreignAtoms.forEach(fAtom => {
                        const dx = atom.x - fAtom.x;
                        const dy = atom.y - fAtom.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        const targetDist = atom.radius + fAtom.radius + 2;
                        
                        if (dist < targetDist + 15 && dist > 0) {
                            const push = (targetDist - dist) * 0.1;
                            dxSum += (dx / dist) * push;
                            dySum += (dy / dist) * push;
                        }
                    });
                    
                    atom.idealX += dxSum;
                    atom.idealY += dySum;
                    atom.x = atom.idealX;
                    atom.y = atom.idealY;
                });
            }
        }

        function setForce(f) {
            state.force = Math.min(100, Math.max(0, f));
            DOM.slider.value = state.force;
            updateUIForce();
            evaluatePhysicsState();
        }

        function updateUIForce() {
            DOM.forceLabel.innerText = `Applied Force: ${Math.floor(state.force)} N`;
            DOM.gaugeText.textContent = Math.floor(state.force);
            
            // Update arc
            // Total length is PI * R (R=40) = 125.66
            const fraction = state.force / 100;
            const dashArray = `${fraction * 125.66}, 125.66`;
            DOM.gaugeVal.setAttribute('stroke-dasharray', dashArray);

            // Color code arc based on yield
            const yieldPoint = state.mode === 'pure' ? config.pureYield : config.alloyYield;
            if (state.force >= yieldPoint) {
                DOM.gaugeVal.style.stroke = state.mode === 'pure' ? '#a78bfa' : '#ef4444';
            } else {
                DOM.gaugeVal.style.stroke = 'var(--primary)';
            }
        }

        function evaluatePhysicsState() {
            if (state.fractured) return;

            const yieldPoint = state.mode === 'pure' ? config.pureYield : config.alloyYield;
            
            if (state.force === 0) {
                state.status = 'idle';
            } else if (state.force < yieldPoint) {
                state.status = (state.mode === 'alloy' && state.force > config.pureYield) ? 'resisting' : 'applying_force';
            } else {
                if (state.mode === 'pure') {
                    state.status = 'sliding';
                } else {
                    state.status = 'fracture';
                    triggerFracture();
                }
            }
            updateBanner();
        }

        function triggerFracture() {
            state.fractured = true;
            state.status = 'fracture';
            
            // Explode atoms
            state.atoms.forEach(atom => {
                atom.vx = (Math.random() - 0.5) * 15;
                atom.vy = (Math.random() - 0.5) * 15 - 5;
            });
            updateBanner();
        }

        function updateBanner() {
            let text = "";
            if (state.mode === 'pure') {
                if (state.status === 'idle' || state.status === 'applying_force') {
                    text = "✅ Regular arrangement of same-size metallic atoms. Layers can slide past each other easily under stress — this is why pure metals are malleable and ductile.";
                } else if (state.status === 'sliding') {
                    text = "⚡ Atomic layers are sliding! The delocalized electrons allow layers to slip without breaking the metallic bond — demonstrating ductility.";
                }
            } else {
                if (state.status === 'idle' || state.status === 'applying_force') {
                    text = "🔬 Foreign atoms with DIFFERENT atomic radii have been introduced into the lattice, disrupting the regular arrangement.";
                } else if (state.status === 'resisting') {
                    text = "🛡️ The foreign atoms (different size) block layer slippage — this is why alloys are HARDER and STRONGER than pure metals.";
                } else if (state.status === 'fracture') {
                    text = "💥 Extreme force has caused fracture. Unlike pure metals, alloys can be more brittle under very high stress.";
                }
            }
            DOM.banner.innerHTML = escapeHtml(text).replace(/✅|⚡|🔬|🛡️|💥/g, match => `<span style="font-size:1.2em">${match}</span>`);
        }

        /** Physics & Render Loop */
        let lastTime = 0;
        function loop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            updatePhysics(dt);
            draw();

            requestAnimationFrame(loop);
        }

        function updatePhysics(dt) {
            if (state.fractured) {
                // Apply gravity and velocity
                state.atoms.forEach(a => {
                    a.vy += 0.5; // gravity
                    a.x += a.vx;
                    a.y += a.vy;
                });
                return;
            }

            // Handle sliding
            if (state.status === 'sliding' && state.mode === 'pure') {
                const slipAmount = (state.force - config.pureYield) * 0.02;
                state.slipOffset += slipAmount;

                state.atoms.forEach(a => {
                    if (a.layer < config.slipLayers) {
                        a.x = a.idealX + state.slipOffset;
                        // Wrap around
                        const w = state.cols * state.baseRadius * 2.2;
                        if (a.x > state.canvasW + a.radius) {
                            a.idealX -= w;
                            a.x = a.idealX + state.slipOffset;
                        }
                    } else {
                        // Elastic return
                        a.x += (a.idealX - a.x) * 0.1;
                    }
                });
            } else if (state.status === 'resisting' && state.mode === 'alloy') {
                // Jiggle slightly to show resistance
                const jiggle = Math.sin(Date.now() / 50) * 2 * (state.force / config.alloyYield);
                state.atoms.forEach(a => {
                    if (a.layer < config.slipLayers) {
                        a.x = a.idealX + (state.force * 0.1) + jiggle;
                    }
                });
            } else {
                // Elastic return to ideal
                state.slipOffset *= 0.9; // decay offset
                state.atoms.forEach(a => {
                    if (a.layer < config.slipLayers) {
                        a.idealX = getIdealX(a.col, a.layer); // Reset ideal in case of wrap
                        a.x += (a.idealX + state.slipOffset - a.x) * 0.1;
                    } else {
                        a.x += (a.idealX - a.x) * 0.1;
                    }
                    a.y += (a.idealY - a.y) * 0.1;
                });
            }

            // Update electrons
            state.electrons.forEach(e => {
                e.x += e.vx;
                e.y += e.vy;
                if (e.x < 0) e.x = state.canvasW;
                if (e.x > state.canvasW) e.x = 0;
                if (e.y < 0) e.y = state.canvasH;
                if (e.y > state.canvasH) e.y = 0;
                
                // Randomly perturb
                if (Math.random() < 0.05) {
                    e.vx = (Math.random() - 0.5) * 0.5;
                    e.vy = (Math.random() - 0.5) * 0.5;
                }
            });

            // Animate force to max
            if (state.animatingForce) {
                setForce(state.force + 1.5);
                if (state.force >= 100 || state.fractured) {
                    state.animatingForce = false;
                }
            }
        }

        function draw() {
            const ctx = DOM.ctx;
            ctx.clearRect(0, 0, state.canvasW, state.canvasH);

            // Draw Slip Plane Indicator
            if (!state.fractured) {
                const slipY = getIdealY(config.slipLayers - 1) + (getIdealY(config.slipLayers) - getIdealY(config.slipLayers - 1)) / 2;
                ctx.beginPath();
                ctx.moveTo(0, slipY);
                ctx.lineTo(state.canvasW, slipY);
                ctx.setLineDash([15, 10]);
                ctx.lineWidth = 3;
                
                if (state.status === 'sliding') {
                    ctx.strokeStyle = '#f97316'; // orange slipping
                } else if (state.status === 'resisting') {
                    ctx.strokeStyle = '#ef4444'; // red resisting
                } else {
                    ctx.strokeStyle = '#22c55e'; // green idle
                }
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = ctx.strokeStyle;
                ctx.font = '14px sans-serif';
                ctx.fillText("Slip Plane", 10, slipY - 10);
            }

            // Draw Bonds (only for pure metal or non-fractured alloy to look clean)
            if (!state.fractured && state.mode === 'pure') {
                ctx.strokeStyle = 'rgba(148,163,184,0.3)';
                ctx.lineWidth = 2;
                for (let i = 0; i < state.atoms.length; i++) {
                    for (let j = i + 1; j < state.atoms.length; j++) {
                        const a1 = state.atoms[i];
                        const a2 = state.atoms[j];
                        const dist = Math.hypot(a1.x - a2.x, a1.y - a2.y);
                        if (dist < state.baseRadius * 3) {
                            ctx.beginPath();
                            ctx.moveTo(a1.x, a1.y);
                            ctx.lineTo(a2.x, a2.y);
                            ctx.stroke();
                        }
                    }
                }
            }

            // Draw Electrons (sea of electrons)
            ctx.fillStyle = 'rgba(251,191,36,0.6)';
            state.electrons.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Blockers (Visual cue for alloy resisting)
            if (state.status === 'resisting' && state.mode === 'alloy' && !state.fractured) {
                state.atoms.filter(a => a.isForeign).forEach(fAtom => {
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 4;
                    const s = fAtom.radius + 10;
                    ctx.beginPath();
                    ctx.moveTo(fAtom.x - s, fAtom.y - s);
                    ctx.lineTo(fAtom.x + s, fAtom.y + s);
                    ctx.moveTo(fAtom.x + s, fAtom.y - s);
                    ctx.lineTo(fAtom.x - s, fAtom.y + s);
                    ctx.stroke();
                });
            }

            // Draw Atoms
            state.atoms.forEach(a => {
                const grad = ctx.createRadialGradient(a.x - a.radius*0.3, a.y - a.radius*0.3, a.radius*0.1, a.x, a.y, a.radius);
                
                let rColor = parseInt(a.color.slice(1,3), 16);
                let gColor = parseInt(a.color.slice(3,5), 16);
                let bColor = parseInt(a.color.slice(5,7), 16);
                
                grad.addColorStop(0, `rgb(${Math.min(255, rColor+50)}, ${Math.min(255, gColor+50)}, ${Math.min(255, bColor+50)})`);
                grad.addColorStop(0.7, a.color);
                grad.addColorStop(1, `rgb(${Math.max(0, rColor-50)}, ${Math.max(0, gColor-50)}, ${Math.max(0, bColor-50)})`);

                ctx.beginPath();
                ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Draw Force Arrow
            if (state.force > 0 && !state.fractured) {
                const arrowX = state.canvasW / 2;
                const arrowY = 30;
                const arrowLen = state.force * 2;
                
                ctx.fillStyle = '#a855f7';
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 6;
                
                // Pulsing effect when pushing
                const pulse = state.status === 'resisting' ? Math.random() * 5 : 0;
                
                ctx.beginPath();
                ctx.moveTo(arrowX - arrowLen/2, arrowY);
                ctx.lineTo(arrowX + arrowLen/2 + pulse, arrowY);
                ctx.stroke();
                
                // Arrow head
                ctx.beginPath();
                ctx.moveTo(arrowX + arrowLen/2 + pulse, arrowY - 10);
                ctx.lineTo(arrowX + arrowLen/2 + 15 + pulse, arrowY);
                ctx.lineTo(arrowX + arrowLen/2 + pulse, arrowY + 10);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(`Force: ${Math.floor(state.force)}N`, arrowX - arrowLen/2, arrowY - 15);
            }

            // Fracture Text
            if (state.fractured) {
                ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
                ctx.fillRect(0, state.canvasH/2 - 40, state.canvasW, 80);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("FRACTURE!", state.canvasW/2, state.canvasH/2 + 15);
                ctx.textAlign = 'left';
            }
        }

        /** Event Listeners */
        DOM.slider.addEventListener('input', (e) => {
            state.animatingForce = false;
            setForce(parseFloat(e.target.value));
        });

        DOM.btnPure.addEventListener('click', () => {
            state.mode = 'pure';
            DOM.btnPure.classList.add('active');
            DOM.btnAlloy.classList.remove('active');
            DOM.markerAlloy.style.display = 'none';
            DOM.textAlloy.style.display = 'none';
            initLattice();
        });

        DOM.btnAlloy.addEventListener('click', () => {
            state.mode = 'alloy';
            DOM.btnAlloy.classList.add('active');
            DOM.btnPure.classList.remove('active');
            DOM.markerAlloy.style.display = 'block';
            DOM.textAlloy.style.display = 'block';
            initLattice();
        });

        DOM.btnMaxForce.addEventListener('click', () => {
            if(state.fractured) initLattice();
            state.animatingForce = true;
        });

        DOM.btnReset.addEventListener('click', () => {
            initLattice();
        });

        // Mouse Drag Interaction for canvas
        DOM.canvas.addEventListener('mousedown', (e) => {
            if(state.fractured) return;
            state.isDragging = true;
            state.lastMouseX = e.clientX;
            state.animatingForce = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (state.isDragging) {
                const dx = e.clientX - state.lastMouseX;
                state.lastMouseX = e.clientX;
                setForce(state.force + dx * 0.5);
            }
        });

        window.addEventListener('mouseup', () => {
            state.isDragging = false;
        });
        
        // Touch support for drag
        DOM.canvas.addEventListener('touchstart', (e) => {
            if(state.fractured) return;
            state.isDragging = true;
            state.lastMouseX = e.touches[0].clientX;
            state.animatingForce = false;
        });
        
        window.addEventListener('touchmove', (e) => {
            if (state.isDragging) {
                const dx = e.touches[0].clientX - state.lastMouseX;
                state.lastMouseX = e.touches[0].clientX;
                setForce(state.force + dx * 0.5);
            }
        });
        
        window.addEventListener('touchend', () => {
            state.isDragging = false;
        });

        // Init
        resizeCanvas();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
