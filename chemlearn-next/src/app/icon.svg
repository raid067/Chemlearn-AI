<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Orbit 1 (30 degrees) -->
  <g transform="rotate(30 16 16)">
    <ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="#64748B" stroke-width="1.5" />
    <circle cx="28" cy="16" r="1.5" fill="#0EA5E9" />
  </g>
  
  <!-- Orbit 2 (90 degrees) -->
  <g transform="rotate(90 16 16)">
    <ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="#64748B" stroke-width="1.5" />
    <circle cx="4" cy="16" r="1.5" fill="#0EA5E9" />
  </g>
  
  <!-- Orbit 3 (150 degrees) -->
  <g transform="rotate(150 16 16)">
    <ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="#64748B" stroke-width="1.5" />
    <circle cx="28" cy="16" r="1.5" fill="#0EA5E9" />
  </g>
  
  <!-- Nucleus -->
  <circle cx="16" cy="16" r="3.5" fill="#F43F5E" />
  
  <!-- Nucleus Highlight (Adds depth on transparent backgrounds) -->
  <circle cx="15" cy="15" r="1" fill="#FDA4AF" />
</svg>
