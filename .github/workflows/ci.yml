name: "CI Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chemlearn-next

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chemlearn-next/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Lint Code
        run: npm run lint

      - name: Run Unit & Regression Tests
        run: npm test -- --runInBand

      - name: Production Build
        run: npm run build
        env:
          GEMINI_API_KEY: "dummy_key_for_ci_build"
          NEXT_PUBLIC_FIREBASE_API_KEY: "dummy_firebase_api_key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy-chemlearn.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dummy-chemlearn"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dummy-chemlearn.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef123456"

      - name: Audit High-Risk Dependencies
        run: npm audit --audit-level=high
