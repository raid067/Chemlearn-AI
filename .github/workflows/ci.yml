name: ChemLearn AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./chemlearn-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chemlearn-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test -- --ci --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Dummy values for build validation if needed
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyTestMockKey1234567890
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: chemlearn-67.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: chemlearn-67
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: chemlearn-67.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "639221527001"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:639221527001:web:mockappid123"
