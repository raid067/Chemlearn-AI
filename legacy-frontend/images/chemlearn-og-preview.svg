<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="280" fill="#7c3aed" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="320" fill="#0284c7" opacity="0.2" filter="url(#glow)" />
  <circle cx="850" cy="180" r="200" fill="#ec4899" opacity="0.15" filter="url(#glow)" />

  <!-- Decorative Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Logo Mark Left -->
  <g transform="translate(100, 100)">
    <!-- Atom Icon -->
    <g transform="translate(0, 0) scale(2.2)">
      <g transform="rotate(30 20 20)">
        <ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.8" />
        <circle cx="38" cy="20" r="3" fill="#38bdf8" />
      </g>
      <g transform="rotate(90 20 20)">
        <ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.8" />
        <circle cx="2" cy="20" r="3" fill="#38bdf8" />
      </g>
      <g transform="rotate(150 20 20)">
        <ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.8" />
        <circle cx="38" cy="20" r="3" fill="#38bdf8" />
      </g>
      <circle cx="20" cy="20" r="6" fill="#a855f7" />
    </g>
    <!-- Brand Text -->
    <text x="110" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      ChemLearn <tspan fill="#a855f7">AI</tspan>
    </text>
    <!-- Syllabus Badge -->
    <rect x="360" y="24" width="220" height="40" rx="20" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1.5" />
    <text x="470" y="49" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#c084fc" text-anchor="middle">
      KSSM SPM FORM 4 &amp; 5
    </text>
  </g>

  <!-- Headline -->
  <text x="100" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Master SPM Chemistry
  </text>
  <text x="100" y="335" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="62" font-weight="800" fill="url(#cyanGrad)" letter-spacing="-1.5">
    With Real Simulations
  </text>

  <!-- Subheadline -->
  <text x="100" y="405" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    Interactive 3D labs, qualitative salt analysis, KSSM rubric essay marker,
  </text>
  <text x="100" y="440" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    and acid-base titration graphs engineered for Malaysian students.
  </text>

  <!-- Feature Pills Bottom -->
  <g transform="translate(100, 495)">
    <g transform="translate(0, 0)">
      <rect width="260" height="54" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="130" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
        🧪 Salt Analysis Matrix
      </text>
    </g>
    <g transform="translate(280, 0)">
      <rect width="260" height="54" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="130" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
        ⚙️ Alloy Shear Physics
      </text>
    </g>
    <g transform="translate(560, 0)">
      <rect width="260" height="54" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="130" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
        🤖 Gemini KSSM Grader
      </text>
    </g>
    <g transform="translate(840, 0)">
      <rect width="180" height="54" rx="14" fill="url(#purpleGrad)" />
      <text x="90" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">
        100% Free
      </text>
    </g>
  </g>
</svg>
